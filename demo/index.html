  <body>
    <main id="demo">
      <noscript>
        <h1>Pitch</h1>
        <p>
          An FFGL effect that puts your clip on an LED wall and photographs the
          wall with a rolling-shutter Bayer camera. Every pixel is a box laid
          over the LED grid and every row a window over the PWM pulse train,
          both integrated analytically, so the moiré, the scan bands, the
          low-grey breakup and the black between the pixels are what two
          samplings do rather than effects drawn on top.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/pitch">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/pitch/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/pitch/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/pitch">Source on GitHub</a></li>
        </ul>
      </noscript>
